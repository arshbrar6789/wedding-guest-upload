<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Event Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --forest: #16261E;
    --forest-deep: #0E1B15;
    --brass: #C9A34E;
    --brass-bright: #E0BE72;
    --ivory: #F6F1E7;
    --sage: #7C9885;
    --clay: #B5533C;
    --radius: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--forest-deep);
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ivory);
    min-height: 100vh;
  }

  h1, h2 { font-family: 'Fraunces', serif; }

  /* ---- Login screen ---- */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    gap: 16px;
    text-align: center;
  }

  #login-screen h1 {
    font-size: 1.8rem;
    font-weight: 500;
    color: var(--brass-bright);
    margin-bottom: 4px;
  }

  #login-screen p.sub {
    color: var(--sage);
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  #login-screen input {
    padding: 12px 16px;
    font-size: 1rem;
    border: 1px solid var(--brass);
    background: var(--forest);
    color: var(--ivory);
    border-radius: 14px;
    width: 100%;
    max-width: 280px;
    font-family: inherit;
  }

  #login-screen input:focus {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  button {
    padding: 12px 20px;
    font-size: 0.95rem;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }

  button:active { opacity: 0.75; }
  button:disabled { opacity: 0.5; cursor: default; }

  .btn-primary {
    background: var(--brass);
    color: var(--forest-deep);
  }

  #error-msg {
    color: var(--clay);
    font-size: 0.85rem;
    min-height: 1em;
  }

  /* ---- Dashboard ---- */
  #app { display: none; }
  #app.visible { display: block; }

  header {
    padding: 20px 20px 16px;
    text-align: center;
    border-bottom: 2px solid var(--brass);
    background: var(--forest);
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--brass-bright);
  }

  header p {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--sage);
  }

  main {
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 16px;
    margin-bottom: 20px;
    background: var(--forest);
    border-radius: var(--radius);
    border: 1px solid rgba(201,163,78,0.25);
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    color: var(--brass-bright);
    font-weight: 500;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--sage);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #refresh-btn {
    display: block;
    margin: 0 auto 16px;
    background: transparent;
    border: 1px solid var(--brass);
    color: var(--brass-bright);
  }

  #status-bar {
    text-align: center;
    padding: 10px;
    font-size: 0.85rem;
    color: var(--sage);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .gallery-tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--forest);
    border: 1px solid rgba(201,163,78,0.25);
  }

  .gallery-tile img, .gallery-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .gallery-tile .video-badge {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.55);
    border-radius: 6px;
    padding: 2px 6px;
    display: flex;
    align-items: center;
  }

  .gallery-tile .video-badge svg { width: 12px; height: 12px; fill: var(--ivory); }

  .tile-delete {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(14,27,21,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile-delete svg { width: 14px; height: 14px; fill: var(--ivory); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--sage);
    font-size: 0.95rem;
    font-family: 'Fraunces', serif;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login-screen">
  <h1 id="login-event-name">Event Dashboard</h1>
  <p class="sub">Enter your event password to view and manage your gallery.</p>
  <input type="password" id="password-input" placeholder="Password" autocomplete="off">
  <button class="btn-primary" id="login-btn">Enter</button>
  <div id="error-msg"></div>
  <p class="sub" style="font-size: 0.8rem; margin-top: 8px;">Forgot your password? Contact us to reset it.</p>
</div>

<div id="app">
  <header>
    <h1 id="dash-event-name">Event Dashboard</h1>
    <p id="dash-event-date"></p>
    <button id="logout-btn" style="margin-top: 10px; background: transparent; border: 1px solid var(--clay); color: var(--clay); padding: 6px 16px; font-size: 0.78rem;">Log Out</button>
  </header>
  <main>
    <div class="stats-bar">
      <div class="stat">        <div class="stat-value" id="stat-count">0</div>
        <div class="stat-label">Items</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-size">0 MB</div>
        <div class="stat-label">Total Size</div>
      </div>
    </div>

    <button id="refresh-btn">Refresh</button>
    <div id="status-bar"></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>
</div>

<script>
  const FUNCTION_BASE = "https://wedding-upload-func-13457.azurewebsites.net/api";

  const urlParams = new URLSearchParams(window.location.search);
  const eventSlug = urlParams.get('event');
  const SESSION_KEY = `client_session_${eventSlug}`;

  let clientPassword = "";
  let eventName = "";

  const el = (id) => document.getElementById(id);

  if (!eventSlug) {
    el('login-event-name').textContent = "No event specified";
    el('error-msg').textContent = "This link is missing an event — please use the dashboard link your provider gave you.";
    el('login-btn').disabled = true;
    el('password-input').disabled = true;
  }

  el('login-btn').addEventListener('click', () => attemptLogin());
  el('password-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  el('refresh-btn').addEventListener('click', loadGallery);
  el('logout-btn').addEventListener('click', logout);

  // ---- Auto-login if this browser tab already has a valid session for this event ----
  const savedPassword = eventSlug ? sessionStorage.getItem(SESSION_KEY) : null;
  if (savedPassword) {
    attemptLogin(savedPassword, true);
  }

  async function attemptLogin(passwordOverride, isAutoLogin) {
    const password = passwordOverride !== undefined ? passwordOverride : el('password-input').value;
    el('error-msg').textContent = "";
    el('login-btn').disabled = true;
    el('login-btn').textContent = isAutoLogin ? "Signing in…" : "Checking…";

    try {
      const res = await fetch(`${FUNCTION_BASE}/client-login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: eventSlug, password })
      });

      if (res.status === 401 || res.status === 404) {
        if (isAutoLogin) {
          // Saved session is no longer valid (password changed, event removed, etc.) — clear it quietly
          sessionStorage.removeItem(SESSION_KEY);
          el('login-btn').disabled = false;
          el('login-btn').textContent = "Enter";
          return;
        }
        const data = await res.json().catch(() => ({}));
        el('error-msg').textContent = data.error || "Login failed.";
        el('login-btn').disabled = false;
        el('login-btn').textContent = "Enter";
        return;
      }
      if (!res.ok) throw new Error('Server error');

      const data = await res.json();
      clientPassword = password;
      eventName = data.event_name;
      sessionStorage.setItem(SESSION_KEY, password);

      el('dash-event-name').textContent = data.event_name;
      if (data.event_date) {
        const d = new Date(data.event_date);
        if (!isNaN(d.getTime())) {
          el('dash-event-date').textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
        }
      }

      el('login-screen').style.display = 'none';
      el('app').classList.add('visible');
      loadGallery();
    } catch (err) {
      if (!isAutoLogin) {
        el('error-msg').textContent = "Could not reach the server. Try again.";
      }
      el('login-btn').disabled = false;
      el('login-btn').textContent = "Enter";
    }
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
    clientPassword = "";
    el('app').classList.remove('visible');
    el('login-screen').style.display = 'flex';
    el('password-input').value = '';
  }

  async function loadGallery() {
    el('status-bar').textContent = "Loading…";
    try {
      const res = await fetch(`${FUNCTION_BASE}/client-gallery?event=${encodeURIComponent(eventSlug)}`, {
        headers: { 'X-Client-Password': clientPassword }
      });
      if (!res.ok) throw new Error('Failed to load');
      const data = await res.json();
      renderGallery(data.items || [], data.totalSize || 0);
    } catch (err) {
      el('status-bar').textContent = "Failed to load. Try refreshing.";
    }
  }

  function isVideo(name) {
    return /\.(mp4|mov|webm|m4v)$/i.test(name);
  }

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
    if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
  }

  function renderGallery(items, totalSize) {
    el('stat-count').textContent = items.length;
    el('stat-size').textContent = formatSize(totalSize);

    const grid = el('gallery-grid');
    grid.innerHTML = '';

    if (items.length === 0) {
      el('status-bar').textContent = "";
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">No photos or videos yet.</div>`;
      return;
    }

    el('status-bar').textContent = "";

    items.forEach(item => {
      const tile = document.createElement('div');
      tile.className = 'gallery-tile';

      const media = isVideo(item.blobName)
        ? Object.assign(document.createElement('video'), { src: item.url, muted: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src: item.url, loading: 'lazy' });
      tile.appendChild(media);

      if (isVideo(item.blobName)) {
        const badge = document.createElement('div');
        badge.className = 'video-badge';
        badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        tile.appendChild(badge);
      }

      const del = document.createElement('button');
      del.className = 'tile-delete';
      del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>';
      del.addEventListener('click', () => deleteItem(item.blobName, tile));
      tile.appendChild(del);

      grid.appendChild(tile);
    });
  }

  async function deleteItem(blobName, tile) {
    if (!confirm("Delete this item? This can't be undone.")) return;

    tile.style.opacity = '0.3';
    try {
      const res = await fetch(`${FUNCTION_BASE}/client-delete-item`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Client-Password': clientPassword
        },
        body: JSON.stringify({ slug: eventSlug, blobName })
      });
      if (!res.ok) throw new Error('Delete failed');
      tile.remove();
      const remaining = el('gallery-grid').children.length;
      el('stat-count').textContent = remaining;
      if (remaining === 0) {
        el('gallery-grid').innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">No photos or videos yet.</div>`;
      }
    } catch (err) {
      tile.style.opacity = '1';
      alert("Could not delete this item. Try again.");
    }
  }
</script>

</body>
</html>
