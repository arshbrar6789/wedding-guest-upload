<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderate — Arsh & Meghna</title>
<style>
  :root {
    --forest: #1f3d2b;
    --forest-dark: #142819;
    --brass: #b08d4f;
    --brass-light: #d4b876;
    --cream: #f5f1e6;
    --danger: #8b3a3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--forest-dark);
    color: var(--cream);
    min-height: 100vh;
  }

  header {
    padding: 24px 20px 16px;
    text-align: center;
    border-bottom: 2px solid var(--brass);
  }

  header h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    color: var(--brass-light);
    font-weight: normal;
  }

  header p {
    margin: 6px 0 0;
    font-size: 0.85rem;
    opacity: 0.7;
  }

  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    padding: 20px;
    gap: 16px;
  }

  #login-screen input {
    padding: 12px 16px;
    font-size: 1rem;
    border: 1px solid var(--brass);
    background: var(--forest);
    color: var(--cream);
    border-radius: 4px;
    width: 100%;
    max-width: 280px;
  }

  button {
    padding: 12px 20px;
    font-size: 0.95rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s ease;
  }

  button:active { opacity: 0.75; }

  .btn-primary {
    background: var(--brass);
    color: var(--forest-dark);
    font-weight: bold;
  }

  .btn-approve {
    background: var(--brass);
    color: var(--forest-dark);
    flex: 1;
  }

  .btn-reject {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    flex: 1;
  }

  #error-msg {
    color: #e2a0a0;
    font-size: 0.85rem;
    min-height: 1em;
  }

  main {
    padding: 16px;
    max-width: 700px;
    margin: 0 auto;
  }

  #status-bar {
    text-align: center;
    padding: 10px;
    font-size: 0.85rem;
    opacity: 0.75;
  }

  #grid {
    display: grid;
    gap: 16px;
  }

  .card {
    background: var(--forest);
    border: 1px solid rgba(176, 141, 79, 0.3);
    border-radius: 6px;
    overflow: hidden;
  }

  .card img, .card video {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    background: #000;
    display: block;
  }

  .card-actions {
    display: flex;
    gap: 10px;
    padding: 12px;
  }

  .card-meta {
    font-size: 0.7rem;
    opacity: 0.5;
    padding: 4px 12px 0;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    opacity: 0.6;
    font-size: 0.95rem;
  }

  .hidden { display: none !important; }

  #refresh-btn {
    display: block;
    margin: 0 auto 16px;
    background: transparent;
    border: 1px solid var(--brass);
    color: var(--brass-light);
  }
</style>
</head>
<body>

<div id="login-screen">
  <header style="border-bottom:none;">
    <h1>Moderation</h1>
    <p>Arsh &amp; Meghna's Wedding</p>
  </header>
  <input type="password" id="password-input" placeholder="Enter password" autocomplete="off">
  <button class="btn-primary" id="login-btn">Enter</button>
  <div id="error-msg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Moderation</h1>
    <p>Arsh &amp; Meghna's Wedding</p>
  </header>
  <main>
    <button id="refresh-btn">Refresh</button>
    <div id="status-bar"></div>
    <div id="grid"></div>
  </main>
</div>

<script>
const FUNCTION_BASE = "https://wedding-upload-func-13457.azurewebsites.net/api";
let password = "";

const loginScreen = document.getElementById("login-screen");
const app = document.getElementById("app");
const passwordInput = document.getElementById("password-input");
const loginBtn = document.getElementById("login-btn");
const errorMsg = document.getElementById("error-msg");
const grid = document.getElementById("grid");
const statusBar = document.getElementById("status-bar");
const refreshBtn = document.getElementById("refresh-btn");

loginBtn.addEventListener("click", attemptLogin);
passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
refreshBtn.addEventListener("click", loadPending);

async function attemptLogin() {
  const candidate = passwordInput.value;
  errorMsg.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Checking...";
  try {
    const res = await fetch(`${FUNCTION_BASE}/list-pending`, {
      headers: { "X-Moderator-Password": candidate }
    });
    if (res.status === 401) {
      errorMsg.textContent = "Incorrect password.";
      loginBtn.disabled = false;
      loginBtn.textContent = "Enter";
      return;
    }
    if (!res.ok) throw new Error("Server error");
    password = candidate;
    loginScreen.classList.add("hidden");
    app.classList.remove("hidden");
    const data = await res.json();
    renderItems(data.items || []);
  } catch (err) {
    errorMsg.textContent = "Could not reach server. Try again.";
    loginBtn.disabled = false;
    loginBtn.textContent = "Enter";
  }
}

async function loadPending() {
  statusBar.textContent = "Loading...";
  try {
    const res = await fetch(`${FUNCTION_BASE}/list-pending`, {
      headers: { "X-Moderator-Password": password }
    });
    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    renderItems(data.items || []);
  } catch (err) {
    statusBar.textContent = "Failed to load. Try refreshing again.";
  }
}

function isVideo(name) {
  return /\.(mp4|mov|webm|m4v)$/i.test(name);
}

function renderItems(items) {
  grid.innerHTML = "";
  if (items.length === 0) {
    statusBar.textContent = "";
    grid.innerHTML = `<div class="empty-state">No photos waiting for review.</div>`;
    return;
  }
  statusBar.textContent = `${items.length} item${items.length === 1 ? "" : "s"} pending review`;

  items.forEach((item) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.blobName = item.blobName;

    const media = isVideo(item.blobName)
      ? `<video src="${item.url}" controls preload="metadata"></video>`
      : `<img src="${item.url}" alt="Pending upload" loading="lazy">`;

    const sizeKb = (item.size / 1024).toFixed(0);

    card.innerHTML = `
      ${media}
      <div class="card-meta">${sizeKb} KB</div>
      <div class="card-actions">
        <button class="btn-approve">Approve</button>
        <button class="btn-reject">Reject</button>
      </div>
    `;

    card.querySelector(".btn-approve").addEventListener("click", () => moderate(item.blobName, "approve", card));
    card.querySelector(".btn-reject").addEventListener("click", () => moderate(item.blobName, "reject", card));

    grid.appendChild(card);
  });
}

async function moderate(blobName, action, card) {
  const buttons = card.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${FUNCTION_BASE}/${action}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Moderator-Password": password
      },
      body: JSON.stringify({ blobName })
    });
    if (!res.ok) throw new Error("Failed");
    card.style.opacity = "0.3";
    setTimeout(() => {
      card.remove();
      if (grid.children.length === 0) {
        grid.innerHTML = `<div class="empty-state">No photos waiting for review.</div>`;
        statusBar.textContent = "";
      } else {
        const remaining = grid.children.length;
        statusBar.textContent = `${remaining} item${remaining === 1 ? "" : "s"} pending review`;
      }
    }, 200);
  } catch (err) {
    buttons.forEach(b => b.disabled = false);
    alert("Action failed. Check connection and try again.");
  }
}
</script>

</body>
</html>
